<article class="card">
  <header class="card__header">
    <time class="card__time" [attr.datetime]="standup.createdAt">
      {{ standup.createdAt | date: 'medium' }}
    </time>

    <!-- Labelled honestly: a fallback summary is never shown as AI output. -->
    <span
      class="badge"
      [class.badge--fallback]="standup.summarySource === 'mock'"
      [title]="
        standup.summarySource === 'ai'
          ? 'Generated by Claude'
          : 'Generated by the local fallback summariser'
      "
    >
      {{ standup.summarySource === 'ai' ? 'AI summary' : 'Fallback summary' }}
    </span>
  </header>

  <p class="card__summary">{{ standup.summary }}</p>

  <dl class="card__details">
    <div class="detail">
      <dt class="detail__term">Yesterday</dt>
      <dd class="detail__value">{{ standup.yesterday }}</dd>
    </div>
    <div class="detail">
      <dt class="detail__term">Today</dt>
      <dd class="detail__value">{{ standup.today }}</dd>
    </div>
    <div class="detail" *ngIf="standup.blockers">
      <dt class="detail__term detail__term--blocker">Blockers</dt>
      <dd class="detail__value">{{ standup.blockers }}</dd>
    </div>
  </dl>
</article>
